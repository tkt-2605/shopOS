# Every push and every PR: the whole test suite, the types, the Rust side on
# both platforms, and an unsigned Windows installer kept as an artifact.
#
# `release.yml` calls this same file before it builds anything, so a tag is
# held to exactly what a PR is held to.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    name: typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Core, the app, the portal and bench Layer 1, migration replay included.
      - run: npm test

  rust-linux:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: webview and gtk headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! wants the frontend folder to exist, not to be built.
      - run: mkdir -p apps/pos/dist
      - run: cargo test --workspace

  windows:
    name: cargo test and unsigned installer (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -w @shopos/pos
      - run: cargo test --workspace
      # Unsigned, and with no update feed: the base config has none, so this
      # installer never looks for an update. Fit for Windows Sandbox.
      - run: npm run tauri -w @shopos/pos -- build
      - uses: actions/upload-artifact@v4
        with:
          name: shopos-unsigned-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
