# A tag vX.Y.Z becomes a draft release that tills can update from once it is
# published -- and not before: GitHub's "latest" skips drafts, so nothing
# reaches a shop until a person has tried the installer and pressed Publish.
#
# Repository settings it needs (Settings -> Secrets and variables -> Actions):
#
#   variables  RELEASE_REPO     owner/repo tills download from. It must be
#                               public: this repository is private, and a till
#                               cannot log in to fetch latest.json. A new
#                               public repo with just a README is enough.
#              UPDATER_PUBKEY   the public half from `npx tauri signer generate`
#              UPDATE_FEED_URL  optional: a feed on your own domain instead
#              RELEASE_FIRST_SHOPS
#                               optional: short shop ids, comma separated. A new
#                               release goes to these shops only; widen it later
#                               with `tools/release.ts target vX.Y.Z --all`.
#              SHOPOS_SUPPORT_PHONE, SHOPOS_SUPPORT_WHATSAPP
#                               the number on the Get help screen
#              SHOPOS_SUPPORT_PUBKEY
#                               the public half from tools/support/keygen.ts;
#                               without it a till offers no data sending
#              SHOPOS_PORTAL_URL
#                               https only; leave unset until the portal is
#                               hosted, and health goes by Telegram alone
#              WINDOWS_SIGN_COMMAND
#                               optional, once there is a certificate: the CA's
#                               command, with %1 for the file. Its credentials
#                               go in secrets and in the build step's env.
#   secrets    TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#              SHOPOS_TG_TOKEN, SHOPOS_TG_CHAT
#                               optional: the vendor's Telegram bot and chat,
#                               baked in so shops send reports with nothing to
#                               paste (see apps/pos/src-tauri/.env.example)
#              RELEASE_TOKEN    a fine-grained token with Contents: write on
#                               RELEASE_REPO only
#
# The feed and the key are baked into the installer, so a till built by this
# checks exactly that feed for the rest of its life. `tools/release.ts config`
# refuses a feed that is not https and a key that is not the updater's.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO }}
  UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
  UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
  WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}

jobs:
  preflight:
    name: tag and settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the tag is the app's version
        run: npx tsx tools/release.ts check "$GITHUB_REF_NAME"
      - name: the settings are all there
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          npx tsx tools/release.ts config
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set; without it no till can accept this update"
            exit 1
          fi
          if [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASE_TOKEN" != true ]; then
            echo "::error::secret RELEASE_TOKEN is not set; it is needed to publish to $RELEASE_REPO"
            exit 1
          fi

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  # Three tills in network namespaces selling, syncing and losing their cables
  # and power at random, then checked to the row (`tools/netns-bench/`): the
  # same run as `soak-nightly.yml`, shorter, and here a gate rather than a
  # finding. A release that splits the books between tills does not get built.
  soak:
    name: soak and catch-up
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo build --release --manifest-path crates/shopos-net/Cargo.toml
      - name: the run
        run: |
          sudo env STEPS=500 SALES=1000 NIGHTLY_DIR=/var/tmp/shopos-release tools/netns-bench/nightly.sh | tee summary.txt
          status=${PIPESTATUS[0]}
          { echo '### Soak before release'; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-soak-evidence
          path: /var/tmp/shopos-release
          retention-days: 30

  build:
    name: installer, signature and latest.json
    needs: [ci, soak]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tsx tools/release.ts config

      - name: build
        working-directory: apps/pos
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHOPOS_TG_TOKEN: ${{ secrets.SHOPOS_TG_TOKEN }}
          SHOPOS_TG_CHAT: ${{ secrets.SHOPOS_TG_CHAT }}
          SHOPOS_SUPPORT_PHONE: ${{ vars.SHOPOS_SUPPORT_PHONE }}
          SHOPOS_SUPPORT_WHATSAPP: ${{ vars.SHOPOS_SUPPORT_WHATSAPP }}
          SHOPOS_SUPPORT_PUBKEY: ${{ vars.SHOPOS_SUPPORT_PUBKEY }}
          SHOPOS_PORTAL_URL: ${{ vars.SHOPOS_PORTAL_URL }}
        run: npx tauri build --config src-tauri/tauri.release.json

      # A hotfix tag names its first shops in its message (`release.ts hotfix`).
      - name: the tag's message
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo 'TAG_MESSAGE<<SHOPOS_EOF'
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)'
            echo 'SHOPOS_EOF'
          } >> "$GITHUB_ENV"

      - run: npx tsx tools/release.ts manifest "$GITHUB_REF_NAME"
        env:
          RELEASE_FIRST_SHOPS: ${{ vars.RELEASE_FIRST_SHOPS }}

      - uses: actions/upload-artifact@v4
        with:
          name: shopos-${{ github.ref_name }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          if-no-files-found: error

      # The maps that read a stack from a shop (vite.config.ts). Kept with the
      # run, never published with the release: they are the source.
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.ref_name }}
          path: apps/pos/sourcemaps/
          if-no-files-found: error
          retention-days: 90

      - name: draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        working-directory: target/release/bundle/nsis
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="ShopOS_${version}_x64-setup.exe"
          flags=(--draft --title "ShopOS $GITHUB_REF_NAME")
          # A beta tag is a prerelease, which "latest" also skips.
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          # The same installer under a name that never changes, so the site can
          # link to .../releases/latest/download/ShopOS-setup.exe and start the
          # download on one click, whatever the version. latest.json keeps
          # pointing at the versioned name, which is what tills verify.
          cp "$installer" ShopOS-setup.exe
          # GitHub orders releases, and so picks "latest", by the date of the
          # commit each tag points at. `gh release create` tags the release
          # repository's newest commit, so two releases with nothing committed
          # between them tie -- v0.1.1 lost "latest" to v0.1.0 exactly so, and
          # every till and the site's download follow "latest". So each release
          # first adds a line to RELEASES.md there and is tagged on that commit.
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" "$RUNNER_TEMP/release-repo"
          (
            cd "$RUNNER_TEMP/release-repo"
            echo "- ${GITHUB_REF_NAME}, built from ${GITHUB_SHA::12}" >> RELEASES.md
            git add RELEASES.md
            git -c user.name="shopos-release" -c user.email="release@users.noreply.github.com" \
              commit -q -m "${GITHUB_REF_NAME}"
            git push -q origin HEAD
          )
          target="$(git -C "$RUNNER_TEMP/release-repo" rev-parse HEAD)"
          flags+=(--target "$target")
          # Shops read this; the draft state and the commit are for the owner
          # and are on the release page and in the Actions run already.
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" "${flags[@]}" \
            --notes "ShopOS ${version} for Windows 10 and 11 (64-bit). Download ShopOS-setup.exe and run it. Built from ${GITHUB_SHA::12}." \
            "$installer" "$installer.sig" latest.json ShopOS-setup.exe
