[package]
name = "shopos-pos"
# Not the app's version: that is apps/pos/package.json, which tauri.conf.json reads.
version = "0.0.0"
edition = "2021"
rust-version = "1.81"

[lib]
name = "shopos_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
crc32fast = "1.5.2"
sha2 = "0.10"
base64 = "0.22"
# X25519, HKDF and ChaCha20-Poly1305 for data sent to support (`support_data.rs`).
ring = "0.17"
flate2 = "1"
shopos-net = { path = "../../../crates/shopos-net" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
